name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy matplotlib
      - name: Run test suite
        run: pytest tests/ -q
      - name: Validation gates (torch/numpy only)
        run: |
          cd validation
          for f in exp1_binning_outliers exp2_normalization \
                   exp3_negative_handling exp4_uncertainty \
                   exp4b_pipeline_uncertainty exp5_bounds exp9_underflow \
                   exp10_dtype_validation exp11_overflow; do
            echo "=== $f ==="
            python "$f.py"
          done

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy matplotlib "tensorflow-cpu>=2.16" "jax[cpu]>=0.10" "flax>=0.12"
      - name: Run tests
        run: pytest tests/ -q
      - name: Validation gates
        run: |
          python validation/exp6_np_equivalence.py
          python validation/exp7_tf_capture.py
          python validation/exp8_jax_capture.py
