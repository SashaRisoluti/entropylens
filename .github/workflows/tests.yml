name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy matplotlib
      - name: Run test suite
        run: pytest tests/ -q
      - name: Validation gates (torch/numpy only)
        run: |
          cd validation
          # every exp*.py except the 3 run by the `backends` job below, so a
          # new script cannot be forgotten
          for f in exp*.py; do
            case "$f" in exp6_*|exp7_*|exp8_*) continue ;; esac
            echo "=== $f ==="
            python "$f"
          done

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy matplotlib "tensorflow-cpu>=2.16" "jax[cpu]>=0.10" "flax>=0.12"
      - name: Run tests
        run: pytest tests/ -q
      - name: Validation gates
        run: |
          python validation/exp6_np_equivalence.py
          python validation/exp7_tf_capture.py
          python validation/exp8_jax_capture.py
